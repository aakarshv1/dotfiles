# =============================================================================
# TMUX CONFIG — HPC-optimized terminal multiplexer setup
# =============================================================================
#
# Installation:
#   1. Install tmux 3.2+ (most clusters have it, or: conda install -c conda-forge tmux)
#   2. Copy this file to ~/.tmux.conf
#   3. Start tmux, press prefix + I to install plugins (via tpm)
#
# WHY tmux:
#   - Session persistence: SSH drops don't kill your work
#   - Multiplexing: multiple panes/windows in one SSH connection
#   - Pairs perfectly with neovim (editor in one pane, claude code / shell in another)
#   - Lighter than screen, better keybindings, scriptable
#
# =============================================================================


# ---------------------------------------------------------------------------
# PREFIX KEY
# ---------------------------------------------------------------------------
# Default is Ctrl-b which is awkward (stretches your hand). Ctrl-a is the
# classic screen binding, but it conflicts with "go to start of line" in bash.
# Ctrl-Space is ergonomic and doesn't conflict with anything.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ---------------------------------------------------------------------------
# GENERAL
# ---------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color support for neovim

set -g mouse on              # enable mouse (scrolling, pane resizing, clicking)
                              # useful while learning, can disable later

set -g history-limit 50000   # generous scrollback (default 2000 is too low for build logs)
set -g base-index 1          # windows start at 1 (0 is far from other keys)
setw -g pane-base-index 1    # panes too
set -g renumber-windows on   # renumber when closing a window

set -sg escape-time 0        # no delay after pressing Esc (critical for vim users,
                              # default 500ms makes mode switching feel laggy)

set -g focus-events on       # let neovim detect focus changes (for auto-reload)

set -g allow-passthrough on  # let terminal graphics escapes (Kitty protocol,
                              # used by e.g. `chafa` to preview images) through
                              # tmux instead of being stripped


# ---------------------------------------------------------------------------
# KEYBINDINGS
# ---------------------------------------------------------------------------

# pane splitting (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"   # vertical split
bind - split-window -v -c "#{pane_current_path}"   # horizontal split
unbind '"'
unbind %

# pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with vim keys (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# new windows open in current directory
bind c new-window -c "#{pane_current_path}"

# quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# vi mode for copy/scrollback
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ---------------------------------------------------------------------------
# APPEARANCE
# ---------------------------------------------------------------------------
# Minimal status bar. No distracting info, just what you need.

set -g status-position top
set -g status-style "bg=default,fg=#cdd6f4"

set -g status-left "#[fg=#89b4fa,bold] #S "     # session name
set -g status-left-length 20

set -g status-right "#[fg=#6c7086] %H:%M "      # just the time

setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g message-style "bg=#313244,fg=#cdd6f4"


# ---------------------------------------------------------------------------
# PLUGINS (via tpm)
# ---------------------------------------------------------------------------
# WHY tpm (tmux plugin manager):
#   - Only mature option, everything else is DIY scripts
#   - Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   - Then press prefix + I inside tmux to install plugins below

set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect: save/restore sessions across tmux server restarts
# (prefix + Ctrl-s to save, prefix + Ctrl-r to restore)
# essential on HPC where you might need to restart tmux after a node reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'  # restore neovim sessions too

# tmux-continuum: auto-save sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# initialize tpm (must be last line)
run '~/.tmux/plugins/tpm/run'
